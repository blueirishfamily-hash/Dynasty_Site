<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Dynasty Command | Fantasy Football League Manager</title>
    <meta name="description" content="Premium Dynasty Fantasy Football League Management Platform with advanced analytics, trade center, and draft capital management powered by Sleeper API." />
    <meta property="og:title" content="Dynasty Command | Fantasy Football League Manager" />
    <meta property="og:description" content="Manage your dynasty league like a pro with advanced analytics, trade tools, and position depth analysis." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;">
    <div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
      <p id="loading-msg" style="margin:0;padding:24px;color:#94a3b8;font-size:1rem;">Loading app…</p>
    </div>
    <script>
      (function() {
        var port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
        var portNum = parseInt(port, 10);
        var onDevServer = window.location.hostname === 'localhost' && (port === '5000' || (portNum >= 5001 && portNum <= 5010));
        if (!onDevServer && (window.location.protocol === 'file:' || window.location.protocol === 'vscode-webview:')) {
          var msg = document.getElementById('loading-msg');
          if (msg) {
            msg.innerHTML = 'This page must be opened from the dev server. Run <strong>npm run dev</strong> in the project, then <a href="http://localhost:5000" style="color:#38bdf8;font-weight:600;">click here to open the app</a>.';
            msg.style.color = '#e2e8f0';
            msg.style.maxWidth = '420px';
            msg.style.textAlign = 'center';
          }
          return;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var msg = document.getElementById('loading-msg');
          if (msg && msg.textContent.indexOf('Loading') === 0) {
            var url = 'http://localhost:5000';
            msg.innerHTML = 'App didn’t load. 1) Run <strong>npm run dev</strong> in the terminal. 2) <a href="' + url + '" style="color:#38bdf8;font-weight:600;">Open ' + url + '</a> in your browser (or copy the link). You are at: <span style="font-size:0.85em;color:#64748b;">' + window.location.href + '</span>';
            msg.style.color = '#e2e8f0';
            msg.style.maxWidth = '480px';
            msg.style.textAlign = 'center';
          }
        }, 5000);
      });
    </script>
  </body>
</html>
